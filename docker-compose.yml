services:
  postgres:
    image: postgres:16-alpine
    container_name: cashflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-cashflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cashflow-network

  redis:
    image: redis:7-alpine
    container_name: cashflow-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cashflow-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cashflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cashflow_pass_local}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cashflow-network

  transactions-api:
    build:
      context: .
      dockerfile: src/Services/Transactions/CashFlow.Transactions.Api/Dockerfile
    container_name: cashflow-transactions-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=${POSTGRES_DB:-cashflow_db};Username=${DB_WRITER_USER:-cashflow_writer};Password=${DB_WRITER_PASSWORD:-writer_secret_pass_local}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=${RABBITMQ_USER:-admin}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-cashflow_pass_local}
      - Authentication__ApiKey=${API_KEY:-cashflow-secret-api-key-2026}
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cashflow-network

  consolidated-api:
    build:
      context: .
      dockerfile: src/Services/Consolidated/CashFlow.Consolidated.Api/Dockerfile
    container_name: cashflow-consolidated-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=${POSTGRES_DB:-cashflow_db};Username=${DB_READER_USER:-cashflow_reader};Password=${DB_READER_PASSWORD:-reader_secret_pass_local}
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - Authentication__ApiKey=${API_KEY:-cashflow-secret-api-key-2026}
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cashflow-network

  consolidated-worker:
    build:
      context: .
      dockerfile: src/Services/Consolidated/CashFlow.Consolidated.Worker/Dockerfile
    container_name: cashflow-consolidated-worker
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=${POSTGRES_DB:-cashflow_db};Username=${DB_WRITER_USER:-cashflow_writer};Password=${DB_WRITER_PASSWORD:-writer_secret_pass_local}
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=${RABBITMQ_USER:-admin}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-cashflow_pass_local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cashflow-network

  web:
    build:
      context: ./src/Web/CashFlow.Web
      dockerfile: Dockerfile
    container_name: cashflow-web
    ports:
      - "3000:80"
    depends_on:
      - transactions-api
      - consolidated-api
    networks:
      - cashflow-network

networks:
  cashflow-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
