server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para a Transactions API (Write-Side)
    location /api/v1/transactions {
        proxy_pass http://transactions-api:8080/api/v1/transactions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso para a Consolidated API (Read-Side)
    location /api/v1/consolidated {
        proxy_pass http://consolidated-api:8080/api/v1/consolidated;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para os Health Checks da Transactions API
    location /health/transactions/ {
        proxy_pass http://transactions-api:8080/health/;
        proxy_set_header Host $host;
    }

    # Proxy para os Health Checks da Consolidated API
    location /health/consolidated/ {
        proxy_pass http://consolidated-api:8080/health/;
        proxy_set_header Host $host;
    }

    # Proxy para Metricas Prometheus
    location /metrics/transactions {
        proxy_pass http://transactions-api:8080/metrics;
    }

    location /metrics/consolidated {
        proxy_pass http://consolidated-api:8080/metrics;
    }
}
